services:
  dash-db:
    # Durable Apache AGE + pgvector image. PGDATA has shared_preload_libraries='age',
    # so recreating cp-db on the plain pgvector image fails to boot (missing age.so).
    # This bakes AGE in → recreate is boot-safe. Build: docker compose build dash-db
    image: cp-db-age:pg18
    build:
      context: .
      dockerfile: db/Dockerfile.age
    container_name: cp-db
    restart: always
    command: >
      postgres
        -c max_connections=300
        -c shared_buffers=1GB
        -c work_mem=32MB
        -c effective_cache_size=3GB
        -c maintenance_work_mem=256MB
        -c password_encryption=scram-sha-256
        -c idle_in_transaction_session_timeout=60000
        -c statement_timeout=120000
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER required}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS required}
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE required}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # -d so it probes the real DB (not just the postmaster socket), and
      # start_period covers first-boot initdb on a cold volume (AWS) so the
      # init seeder never fires into a not-yet-ready DB and dies exit 2.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER required} -d ${DB_DATABASE:?DB_DATABASE required}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - dash
    deploy:
      resources:
        limits:
          memory: 4G

  dash-pgbouncer:
    # Pinned by digest (= the image currently running, PgBouncer 1.25.1). :latest
    # would silently pull a breaking pgbouncer major (auth/param handling) between
    # the app and DB on the next compose pull/recreate. Bump deliberately.
    image: edoburu/pgbouncer@sha256:85d1e38593617af1b5f7f285e97d407e56c29939683cc7cfe4c8f6dc19f1268b
    container_name: cp-pgbouncer
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      DATABASE_URL: postgres://${DB_USER:?DB_USER required}:${DB_PASS:?DB_PASS required}@dash-db:5432/${DB_DATABASE:?DB_DATABASE required}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 3000
      DEFAULT_POOL_SIZE: 80
      MIN_POOL_SIZE: 20
      RESERVE_POOL_SIZE: 20
      MAX_DB_CONNECTIONS: 200
      SERVER_RESET_QUERY: DISCARD ALL
      SERVER_IDLE_TIMEOUT: 300
      CLIENT_IDLE_TIMEOUT: 600
      QUERY_WAIT_TIMEOUT: 30
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    depends_on:
      dash-db:
        condition: service_healthy
    networks:
      - dash
    deploy:
      resources:
        limits:
          memory: 512M

  # One-shot DB seeder. Loads the complete baseline schema (db/baseline/schema.sql
  # + migrations_seed.sql) into a FRESH database so a brand-new cloud install comes
  # up clean on the FIRST boot — no manual `scripts/init_fresh_db.sh` step needed.
  # Uses the AGE/pgvector postgres image because it ships `psql` (the app image does
  # not). IDEMPOTENT + guarded: if public.dash_projects already exists it exits 0
  # immediately and touches nothing — so existing/populated installs are unaffected.
  # dash-api waits for this to complete successfully before booting.
  dash-init:
    image: cp-db-age:pg18
    container_name: cp-init
    restart: "no"
    environment:
      PGHOST: dash-db
      PGPORT: "5432"
      PGUSER: ${DB_USER:?DB_USER required}
      PGPASSWORD: ${DB_PASS:?DB_PASS required}
      PGDATABASE: ${DB_DATABASE:?DB_DATABASE required}
    volumes:
      - ./db/baseline:/baseline:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        echo "[init] waiting for postgres at $$PGHOST:$$PGPORT (db=$$PGDATABASE user=$$PGUSER)..."
        ready=""
        i=1
        while [ "$$i" -le 60 ]; do
          if psql -tAc "SELECT 1" >/dev/null 2>&1; then ready=1; echo "[init] db reachable after $$i attempt(s)."; break; fi
          echo "[init] db not ready yet ($$i/60) — retrying in 2s..."
          sleep 2
          i=$$((i + 1))
        done
        if [ -z "$$ready" ]; then
          echo "[init] FATAL: could not connect to $$PGHOST:$$PGPORT after 120s. Last psql error:"
          psql -tAc "SELECT 1" || true
          exit 2
        fi
        echo "[init] checking if database already has schema..."
        exists="$$(psql -tAc "SELECT to_regclass('public.dash_projects') IS NOT NULL")"
        if [ "$$exists" = "t" ]; then
          echo "[init] public.dash_projects exists - DB already initialized, skipping baseline load."
          exit 0
        fi
        echo "[init] fresh database detected - loading baseline schema..."
        psql -v ON_ERROR_STOP=1 -q -f /baseline/schema.sql
        echo "[init] seeding migration tracking rows..."
        psql -v ON_ERROR_STOP=1 -q -f /baseline/migrations_seed.sql
        tbls="$$(psql -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema IN ('public','dash','citypharma')")"
        echo "[init] baseline loaded: $$tbls tables. Done."
    depends_on:
      dash-db:
        condition: service_healthy
    networks:
      - dash

  dash-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build provenance — surfaced on the login screen + admin via /api/version.
        # APP_VERSION empty => Dockerfile default 'dev' => endpoint reads the baked
        # /app/VERSION file. To stamp the env too: APP_VERSION=$(cat VERSION) docker compose build.
        APP_VERSION: ${APP_VERSION:-}
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-}
    image: ${IMAGE_NAME:-citypharma}:${IMAGE_TAG:-latest}
    container_name: cp-api
    command: gunicorn -c scripts/gunicorn_conf.py app.main:app
    restart: always
    ports:
      - "127.0.0.1:8011:8000"
    environment:
      # Core
      - RUNTIME_ENV=prd
      - PYTHONPATH=/app
      - AGNO_DEBUG=False
      - AGNO_TELEMETRY=${AGNO_TELEMETRY:-false}
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-true}
      - AGENTOS_URL=http://127.0.0.1:8000
      # Single-agent product lock (CityPharma)
      - SINGLE_AGENT_MODE=${SINGLE_AGENT_MODE:-1}
      - LOCKED_PROJECT_SLUG=${LOCKED_PROJECT_SLUG:-citypharma}
      - PRODUCT_NAME=${PRODUCT_NAME:-CityAgent Pharma}
      # Database — goes through PgBouncer
      - DB_HOST=dash-pgbouncer
      - DB_PORT=5432
      - DB_USER=${DB_USER:?DB_USER required}
      - DB_PASS=${DB_PASS:?DB_PASS required}
      - DB_DATABASE=${DB_DATABASE:?DB_DATABASE required}
      # Scaling
      - RATE_LIMIT=${RATE_LIMIT:-500/minute}
      # OpenAI-compat gateway: per-store-key rate cap (Redis-backed, global)
      - API_GW_RATE_PER_MIN=${API_GW_RATE_PER_MIN:-60}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASS:-}@dash-redis:6379}
      # Required
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # Multi-key pool (round-robin + per-key 429 cooldown) for 1000-store scale
      - OPENROUTER_API_KEYS=${OPENROUTER_API_KEYS:-}
      # Gunicorn worker count (concurrent-chat ceiling)
      - WORKERS=${WORKERS:-4}
      # Canonical public origin for embed snippets/SDK/docs (set to AWS domain,
      # e.g. https://pharma.yourdomain.com). Blank → frontend uses the browser origin.
      - PUBLIC_URL=${PUBLIC_URL:-}
      # Dead-daemon gates — no external connectors / pruned verticals single-tenant
      - CONNECTOR_SCHEDULER_DISABLED=${CONNECTOR_SCHEDULER_DISABLED:-1}
      # S3 auto-sync daemon: poll a bucket → replace tables from changed files →
      # retrain. DEFAULT OFF. Configure sources in Integrations → S3 Sync. Per-source
      # schedule + creds live in the DB; this just turns the poller on.
      - S3_SYNC_ENABLED=${S3_SYNC_ENABLED:-0}
      - S3_SYNC_TICK_SECONDS=${S3_SYNC_TICK_SECONDS:-60}
      # Privacy: dashboards show keyword/topic analytics only, never raw chat.
      # Text is hard-hidden server-side; flip PRIVACY_SHOW_CHAT=1 only for an
      # audited reveal build. Keyword topic LLM daemon is default OFF.
      - PRIVACY_SHOW_CHAT=${PRIVACY_SHOW_CHAT:-0}
      - KEYWORD_TOPICS_ENABLED=${KEYWORD_TOPICS_ENABLED:-0}
      - KEYWORD_TOPICS_TICK_SECONDS=${KEYWORD_TOPICS_TICK_SECONDS:-3600}
      - VERTICAL_DAEMONS_DISABLED=${VERTICAL_DAEMONS_DISABLED:-1}
      - QUERY_CURATOR_ENABLED=${QUERY_CURATOR_ENABLED:-0}
      - CACHE_CURATOR_ENABLED=${CACHE_CURATOR_ENABLED:-0}
      # Tuned (Q4) on a real paraphrase sim distribution — text-embedding-3-small
      # spreads genuine analytical paraphrases 0.81-0.95 (unrelated <0.80), so the
      # old 0.96 serve bar caught almost none. 0.93 = tight enough for a zero-LLM
      # bypass, loose enough for close paraphrases. Re-validate on real traffic.
      - QUERY_BANK_SERVE_SIM=${QUERY_BANK_SERVE_SIM:-0.93}
      - QUERY_BANK_RECALL_SIM=${QUERY_BANK_RECALL_SIM:-0.80}
      # Curator auto-promote safety: a candidate must recur >= MIN_USES times
      # before the daemon promotes it to zero-LLM serve; at most MAX_PROMOTE
      # promotions per cycle; any 👎 on the question blocks auto-promote.
      - QUERY_CURATOR_MIN_USES=${QUERY_CURATOR_MIN_USES:-3}
      - QUERY_CURATOR_MAX_PROMOTE=${QUERY_CURATOR_MAX_PROMOTE:-10}
      # Correctness gate: independently re-derive the answer (fresh LLM SQL) and
      # require it to AGREE before auto-promote. Off = demand-gates only.
      - QUERY_CURATOR_CROSSCHECK=${QUERY_CURATOR_CROSSCHECK:-1}
      - QUERY_BANK_EMB_TTL=${QUERY_BANK_EMB_TTL:-300}
      # Mode-1.5 reasoning cache (#2) — reuse a proven query plan with the STORE
      # literal swapped. DEFAULT OFF: when off it SHADOW-logs what it would serve
      # (dash_query_bank_shadow) so you can validate on real traffic before
      # flipping it on. Shape-match gate = QUERY_PARAM_SWAP_MIN.
      - QUERY_PARAM_SWAP_ENABLED=${QUERY_PARAM_SWAP_ENABLED:-0}
      - QUERY_PARAM_SWAP_MIN=${QUERY_PARAM_SWAP_MIN:-0.92}
      # Insight compilation daemon (#1) + fact freshness (#4). DEFAULT OFF —
      # distils pending brain insights from query history + live data and flags
      # facts unused for STALE_DAYS. Opt in with INSIGHT_DAEMON_ENABLED=1.
      - INSIGHT_DAEMON_ENABLED=${INSIGHT_DAEMON_ENABLED:-0}
      - INSIGHT_STALE_DAYS=${INSIGHT_STALE_DAYS:-120}
      # Self-distill daemon (#5) — distils pending memory facts from 👎 corrections
      # (admin-approved before chat). DEFAULT OFF (LLM cost). MAX caps per cycle.
      - DISTILLER_ENABLED=${DISTILLER_ENABLED:-0}
      - DISTILLER_MAX_PER_CYCLE=${DISTILLER_MAX_PER_CYCLE:-5}
      # Gateway chat-body logging → dash_apigw_messages (powers per-key Questions
      # drill-down + auto-learn harvest). PII: keep on only with consent.
      - APIGW_LOG_BODIES=${APIGW_LOG_BODIES:-1}
      # Embed widget chat-body logging → dash_embed_calls.message_text/response_text
      # (powers the Monitoring QUESTION/ANSWER panels). PII: consumer chat — consent only.
      - EMBED_LOG_BODIES=${EMBED_LOG_BODIES:-1}
      # Embedding-call input text → dash_apigw_usage.input_preview (powers the
      # Usage → Embeddings drill-down "with the question"). Privacy opt-in.
      - EMBED_LOG_INPUT=${EMBED_LOG_INPUT:-1}
      # DEV: caching OFF for real fresh test/eval behaviour. PROD: APIGW_CACHE_TTL=90,
      # drop METRIC_SHORTCUT_DISABLED (cache hides the 70-220s repeat-question latency).
      - APIGW_CACHE_TTL=${APIGW_CACHE_TTL:-90}
      - METRIC_SHORTCUT_DISABLED=${METRIC_SHORTCUT_DISABLED:-0}
      # Latency tuning (2026-06-16). SINGLE_AGENT_FASTPATH: simple TRIVIAL/LOOKUP
      # pure-data questions skip the multi-agent team's leader<->member
      # coordination (~10-15 serial LLM turns -> ~2-3). ON by default (verified
      # 2026-06-16: cold LOOKUP 32-63s -> 8-18s, Burmese intact, no delegation);
      # set 0 to disable. Anything needing the Researcher or above LOOKUP keeps
      # the full team.
      - SINGLE_AGENT_FASTPATH=${SINGLE_AGENT_FASTPATH:-1}
      # History runs carried into each LLM turn (lower = less prompt = faster).
      - NUM_HISTORY_RUNS=${NUM_HISTORY_RUNS:-3}
      # Rerank fail-fast guards (cohere via OpenRouter could hang 21s).
      - RERANK_SKIP_BELOW=${RERANK_SKIP_BELOW:-6}
      - RERANK_TIMEOUT_S=${RERANK_TIMEOUT_S:-5}
      - RERANK_MAX_MODELS=${RERANK_MAX_MODELS:-1}
      - RERANK_API_ENABLED=${RERANK_API_ENABLED:-1}
      # Floor model reasoning_effort at "low" on every turn (streams a thinking
      # trace, +400-1000ms). OFF by default — this is a pharmacy-counter lookup
      # tool (stock / substitute / nearby-outlet), which needs zero reasoning;
      # the tool-step strip still shows. Real analysis (deep pick / ANALYSIS tier)
      # still gets reasoning. Set 1 to re-enable the universal floor. 2026-06-11.
      - REASONING_FLOOR=${REASONING_FLOOR:-0}
      # Per-store API service accounts (svc:outlet-<code>) auto-minted on data
      # load when on. 0 = off (no auto svc:outlet-* keys). 2026-06-09.
      - APIGW_AUTO_PROVISION=${APIGW_AUTO_PROVISION:-0}
      # Engineer semantic-layer matview builder during training. 0 = off. 2026-06-09.
      - ENGINEER_SEMANTIC_LAYER=${ENGINEER_SEMANTIC_LAYER:-0}
      # Catalog LLM gap-fill + low-risk auto-apply during training. 0 = off
      # (articles_enriched view still rebuilds for manual approvals). 2026-06-10.
      - CATALOG_ENRICH=${CATALOG_ENRICH:-0}
      - CATALOG_ENRICH_LIMIT=${CATALOG_ENRICH_LIMIT:-200}
      # Concurrent agent runs for the chat tier (embed + chat share this async
      # semaphore). 20 = true 20-store-parallel embed load; raise for more.
      - LLM_PARALLEL_CAP_CHAT=${LLM_PARALLEL_CAP_CHAT:-20}
      # Models (3-tier with auto-fallback via OpenRouter models[])
      - CHAT_MODEL=${CHAT_MODEL:-google/gemini-3-flash-preview}
      - DEEP_MODEL=${DEEP_MODEL:-google/gemini-3-flash-preview}
      - LITE_MODEL=${LITE_MODEL:-google/gemini-3-flash-preview}
      - MID_MODEL=${MID_MODEL:-google/gemini-3-flash-preview}
      - REASONING_MODEL=${REASONING_MODEL:-google/gemini-3-flash-preview}
      - ULTRA_MODEL=${ULTRA_MODEL:-google/gemini-3-flash-preview}
      - TRAINING_MODEL=${TRAINING_MODEL:-}
      # GA failover chain. Primary models above are a *-preview alias (parked,
      # do not change without a quality pass); preview IDs are retired by the
      # provider on notice. These GA fallbacks keep chat alive when that happens
      # — OpenRouter only routes to them when the primary 404s, so zero change in
      # normal operation. Override per-tier in .env if you pin different GA models.
      - CHAT_FALLBACKS=${CHAT_FALLBACKS:-google/gemini-2.5-flash,google/gemini-2.0-flash-001}
      - DEEP_FALLBACKS=${DEEP_FALLBACKS:-google/gemini-2.5-flash,google/gemini-2.0-flash-001}
      - LITE_FALLBACKS=${LITE_FALLBACKS:-google/gemini-2.5-flash-lite,google/gemini-2.0-flash-001}
      - SUPER_ADMIN=${SUPER_ADMIN:?SUPER_ADMIN required}
      - SUPER_ADMIN_PASS=${SUPER_ADMIN_PASS:?SUPER_ADMIN_PASS required}
      # Set to 1 to force-resync the super-admin password from SUPER_ADMIN_PASS on
      # every boot (use if the password was lost). Default 0 = a password changed in
      # the UI survives reboots. The account is always ensured + promoted to role=super.
      - SUPER_ADMIN_RESET_PASS=${SUPER_ADMIN_RESET_PASS:-0}
      # Connector-credential encryption (Fernet). Generate ONCE and keep stable
      # forever — rotating it makes existing encrypted credentials undecryptable.
      #   python -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())"
      # Required only when S3/connectors are used; crypto.get_fernet() raises if a
      # connector op runs without this (or JWT_SECRET) set — no hardcoded fallback.
      - CONNECTION_ENCRYPTION_KEY=${CONNECTION_ENCRYPTION_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-}
      # Blank is a VALID value: app falls back to PUBLIC_URL, else allows all
      # origins without credentials. Use :- (default empty), NOT :? (which
      # rejects an empty string and breaks cold installs shipping a blank .env).
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - DOMAIN=${DOMAIN:-localhost}
      # Optional — Keycloak SSO
      - KEYCLOAK_URL=${KEYCLOAK_URL:-}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-dash}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-dash-app}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-}
      # Optional — Slack
      - SLACK_TOKEN=${SLACK_TOKEN:-}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
      # Phase 9 — Skills auto-inject (Layer 14) + skl_pptx_builder
      - EXPERIMENTAL_AGI=${EXPERIMENTAL_AGI:-0}
      # Deep Deck enrichment — Pexels hero images (optional, free 200/hr tier)
      - PEXELS_API_KEY=${PEXELS_API_KEY:-}
      # PPTX rendering — native python-pptx, in-process (no sidecar).
      - PPTX_ENGINE=${PPTX_ENGINE:-native}
      # Training Pipeline V2 — Phase E (vertical detect+apply via fingerprint-cached step runner). Default off.
      - TRAINING_V2_PHASE_E=${TRAINING_V2_PHASE_E:-0}
      # SFTP drop-folder ingest — app talks to the SFTPGo sidecar's admin REST
      # (internal network) to manage virtual SFTP users from /command-center.
      - SFTPGO_BASE_URL=${SFTPGO_BASE_URL:-http://cp-sftpgo:8080}
      - SFTPGO_ADMIN_USER=${SFTPGO_ADMIN_USER:-sftpadmin}
      - SFTPGO_ADMIN_PASS=${SFTPGO_ADMIN_PASS:-}
      - SFTP_DATA_DIR=/app/sftp_data
      - SFTP_PUBLIC_HOST=${SFTP_PUBLIC_HOST:-}
      - SFTP_PUBLIC_PORT=${SFTP_PUBLIC_PORT:-2222}
      # Phase 2 watcher — ingest dropped files via guarded /api/upload. On by default.
      - SFTP_WATCH_ENABLED=${SFTP_WATCH_ENABLED:-1}
      - SFTP_WATCH_TICK_SECONDS=${SFTP_WATCH_TICK_SECONDS:-30}
      - SFTP_STABLE_SECONDS=${SFTP_STABLE_SECONDS:-20}
      - SFTP_MAX_FILE_MB=${SFTP_MAX_FILE_MB:-1024}
      # Auto-delete drops older than N hours (0 = keep forever; manual purge in UI). 168 = 7 days.
      - SFTP_RETENTION_HOURS=${SFTP_RETENTION_HOURS:-0}
      - SFTP_RETENTION_SWEEP_SECONDS=${SFTP_RETENTION_SWEEP_SECONDS:-21600}
    volumes:
      - knowledge_data:/app/knowledge
      # SFTP drops (Phase 1 watcher reads here; app never writes — sftpgo owns it).
      - sftp_data:/app/sftp_data:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      dash-db:
        condition: service_healthy
      dash-init:
        condition: service_completed_successfully
      dash-pgbouncer:
        condition: service_healthy
      dash-redis:
        condition: service_healthy
    networks:
      - dash
    deploy:
      resources:
        limits:
          memory: 8G

  dash-redis:
    image: redis:7-alpine
    container_name: cp-redis
    restart: unless-stopped
    # REDIS_PASS blank (default) = no auth, unchanged behavior. Set it in prod to
    # require auth (defense-in-depth — Redis is internal-only but still). The app
    # reads the password from REDIS_URL (set below), so both move together.
    environment:
      - REDIS_PASS=${REDIS_PASS:-}
    command: ["sh", "-c", "exec redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru ${REDIS_PASS:+--requirepass \"$$REDIS_PASS\"}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASS:+-a \"$$REDIS_PASS\"} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - dash
    deploy:
      resources:
        limits:
          memory: 512M

  # NOTE: the bundled Caddy reverse proxy moved to the optional `compose.caddy.yaml`
  # overlay. Production fronts the stack with nginx (see deploy/nginx/cityagent.conf);
  # the app is published on 127.0.0.1:8011 for that external proxy. To run the old
  # bundled Caddy instead:
  #   docker compose -f compose.yaml -f compose.caddy.yaml up -d

  dash-ml:
    # Opt-in (2026-05-20 trim). Only needed for AutoML (gated off) + the
    # TRAIN-ALL anomaly-model pre-train for tables >1000 rows + 24h retrain.
    # All 6 Data Scientist chat tools run INLINE in dash-api and do NOT need
    # this worker. Start it with: docker compose --profile ml up -d dash-ml
    profiles: ["ml"]
    build:
      context: .
      dockerfile: ml_worker/Dockerfile
    container_name: cp-ml
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${DB_USER:?DB_USER required}:${DB_PASS:?DB_PASS required}@dash-pgbouncer:5432/${DB_DATABASE:?DB_DATABASE required}
      - DB_HOST=dash-pgbouncer
      - DB_PORT=5432
      - DB_USER=${DB_USER:?DB_USER required}
      - DB_PASS=${DB_PASS:?DB_PASS required}
      - DB_DATABASE=${DB_DATABASE:?DB_DATABASE required}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - CHAT_MODEL=${CHAT_MODEL:-google/gemini-3-flash-preview}
      - DEEP_MODEL=${DEEP_MODEL:-google/gemini-3-flash-preview}
      - LITE_MODEL=${LITE_MODEL:-google/gemini-3-flash-preview}
      - MID_MODEL=${MID_MODEL:-google/gemini-3-flash-preview}
      - REASONING_MODEL=${REASONING_MODEL:-google/gemini-3-flash-preview}
      - ULTRA_MODEL=${ULTRA_MODEL:-google/gemini-3-flash-preview}
      - TRAINING_MODEL=${TRAINING_MODEL:-}
      # GA failover chain. Primary models above are a *-preview alias (parked,
      # do not change without a quality pass); preview IDs are retired by the
      # provider on notice. These GA fallbacks keep chat alive when that happens
      # — OpenRouter only routes to them when the primary 404s, so zero change in
      # normal operation. Override per-tier in .env if you pin different GA models.
      - CHAT_FALLBACKS=${CHAT_FALLBACKS:-google/gemini-2.5-flash,google/gemini-2.0-flash-001}
      - DEEP_FALLBACKS=${DEEP_FALLBACKS:-google/gemini-2.5-flash,google/gemini-2.0-flash-001}
      - LITE_FALLBACKS=${LITE_FALLBACKS:-google/gemini-2.5-flash-lite,google/gemini-2.0-flash-001}
    depends_on:
      dash-db:
        condition: service_healthy
      dash-pgbouncer:
        condition: service_healthy
    networks:
      - dash
    deploy:
      resources:
        limits:
          memory: 2G

  # Optional: stdio MCP bridge for local IDE integrations.
  # Claude Desktop / Cursor / Windsurf connect via `docker exec -i dash-mcp …`.
  # Opt-in: `docker compose --profile mcp up -d dash-mcp`.
  dash-mcp:
    image: ${IMAGE_NAME:-citypharma}:${IMAGE_TAG:-latest}
    container_name: cp-mcp
    restart: unless-stopped
    command: ["tail", "-f", "/dev/null"]  # idle; clients invoke `docker exec -i dash-mcp python -m mcp_server`
    environment:
      - DB_HOST=dash-pgbouncer
      - DB_PORT=5432
      - DB_USER=${DB_USER:?DB_USER required}
      - DB_PASS=${DB_PASS:?DB_PASS required}
      - DB_DATABASE=${DB_DATABASE:?DB_DATABASE required}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - CHAT_MODEL=${CHAT_MODEL:-google/gemini-3-flash-preview}
      - DEEP_MODEL=${DEEP_MODEL:-google/gemini-3-flash-preview}
      - LITE_MODEL=${LITE_MODEL:-google/gemini-3-flash-preview}
      - MID_MODEL=${MID_MODEL:-google/gemini-3-flash-preview}
      - REASONING_MODEL=${REASONING_MODEL:-google/gemini-3-flash-preview}
      - ULTRA_MODEL=${ULTRA_MODEL:-google/gemini-3-flash-preview}
      - SUPER_ADMIN=${SUPER_ADMIN:?SUPER_ADMIN required}
      - DASH_MCP_LOG_LEVEL=${DASH_MCP_LOG_LEVEL:-INFO}
    depends_on:
      dash-pgbouncer:
        condition: service_healthy
      dash-api:
        condition: service_started
    networks:
      - dash
    deploy:
      resources:
        limits:
          memory: 512M
    profiles:
      - mcp

  # Nightly pg_dump backup → /var/backups/dash, 7-day retention.
  # Updates public.dash_system_status.last_backup_at after each successful dump,
  # which is surfaced on /health. See docs/BACKUP.md for restore.
  dash-backup:
    image: postgres:18-alpine
    container_name: cp-backup
    restart: unless-stopped
    # Alpine doesn't ship python by default — install it once, then run daemon.
    command: ["sh", "-c", "apk add --no-cache python3 >/dev/null && exec python3 /opt/backup/backup_daemon.py"]
    environment:
      - DB_HOST=dash-db
      - DB_PORT=5432
      - DB_USER=${DB_USER:?DB_USER required}
      - DB_PASS=${DB_PASS:?DB_PASS required}
      - DB_DATABASE=${DB_DATABASE:?DB_DATABASE required}
      - BACKUP_DIR=/var/backups/dash
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./cron/backup_daemon.py:/opt/backup/backup_daemon.py:ro
      - backup_data:/var/backups/dash
    depends_on:
      dash-db:
        condition: service_healthy
    networks:
      - dash
    deploy:
      resources:
        limits:
          memory: 256M

  # SFTP drop-folder ingest. Pharmacy users `sftp put` a CSV/Excel into their own
  # jailed folder; a watcher (Phase 1) ingests it via the existing /api/upload.
  # Virtual users live in OUR Postgres (prefix sftpgo_) — managed from the admin
  # console (Phase 1), NOT from this file. This block is the engineer one-time
  # hardening only. SFTP user accounts are NEVER app (dash_users) accounts.
  dash-sftpgo:
    # Digest-pinned (supply-chain): drakkan/sftpgo:alpine as pulled 2026-06-15.
    # Re-pin deliberately on upgrade: docker pull drakkan/sftpgo:alpine && update sha.
    image: drakkan/sftpgo@sha256:c6b11975122f1210aa5eed426cf39a9f5136759ff41b724a6d54486390711100
    container_name: cp-sftpgo
    restart: unless-stopped
    # Hardening (see docs/SFTP.md for the AWS-side firewall — Security Group on 2222):
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      # User store = our Postgres (direct to dash-db, its own migrated tables).
      - SFTPGO_DATA_PROVIDER__DRIVER=postgresql
      - SFTPGO_DATA_PROVIDER__HOST=dash-db
      - SFTPGO_DATA_PROVIDER__PORT=5432
      - SFTPGO_DATA_PROVIDER__NAME=${DB_DATABASE:?DB_DATABASE required}
      - SFTPGO_DATA_PROVIDER__USERNAME=${DB_USER:?DB_USER required}
      - SFTPGO_DATA_PROVIDER__PASSWORD=${DB_PASS:?DB_PASS required}
      - SFTPGO_DATA_PROVIDER__SQL_TABLES_PREFIX=sftpgo_
      - SFTPGO_DATA_PROVIDER__USERS_BASE_DIR=/srv/sftpgo/data
      # Bootstrap admin (used by app REST calls in Phase 1). Override in .env.
      - SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN=true
      - SFTPGO_DEFAULT_ADMIN_USERNAME=${SFTPGO_ADMIN_USER:-sftpadmin}
      - SFTPGO_DEFAULT_ADMIN_PASSWORD=${SFTPGO_ADMIN_PASS:?SFTPGO_ADMIN_PASS required}
      # SFTP listener on 2022 (mapped to host 2222). High port → no NET_BIND cap.
      - SFTPGO_SFTPD__BINDINGS__0__PORT=2022
      # Admin/web API on 8080 (mapped to 127.0.0.1 only — never public).
      - SFTPGO_HTTPD__BINDINGS__0__PORT=8080
      - SFTPGO_HTTPD__BINDINGS__0__ADDRESS=0.0.0.0
      # Brute-force auto-ban.
      - SFTPGO_COMMON__DEFENDER__ENABLED=true
      - SFTPGO_COMMON__DEFENDER__THRESHOLD=5
      - SFTPGO_COMMON__DEFENDER__BAN_TIME=30
      - SFTPGO_COMMON__DEFENDER__BAN_TIME_INCREMENT=100
    ports:
      # SFTP — FIREWALL to known pharmacy IPs on AWS (Security Group). Not 0.0.0.0.
      - "2222:2022"
      # Admin/web REST — localhost only; the app proxies it. Never internet-facing.
      - "127.0.0.1:8092:8080"
    volumes:
      - sftp_data:/srv/sftpgo/data
    depends_on:
      dash-db:
        condition: service_healthy
    networks:
      - dash
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  dash:

volumes:
  pgdata:
  knowledge_data:
  backup_data:
  redis_data:
  sftp_data:
