name: release

# Build the app image and publish it to GitHub Container Registry (GHCR) so a
# turnkey install can `docker compose pull` instead of building from source.
#
# Tags pushed:
#   ghcr.io/<owner>/citypharma:<git-tag>     (e.g. :1.45.0, from a v* tag)
#   ghcr.io/<owner>/citypharma:latest
#
# Trigger: push a tag like `v1.45.0`, or run manually (workflow_dispatch).
# Consume: set IMAGE_NAME=ghcr.io/<owner>/citypharma in .env, then
#   docker compose -f compose.yaml pull && docker compose -f compose.yaml up -d

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/citypharma
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      # The Dockerfile pulls oven/bun:1 for the frontend build stage. Docker Hub
      # occasionally returns EOF mid-pull — pre-pull with retry so the build
      # never ships a stale/failed frontend layer.
      - name: Pre-pull frontend base (retry)
        run: |
          for i in 1 2 3 4 5; do
            docker pull oven/bun:1 && break || { echo "retry $i"; sleep 5; }
          done

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
