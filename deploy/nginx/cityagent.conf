# CityAgent — nginx reverse proxy (production front door)
# ---------------------------------------------------------------------------
# Put this on the AWS box's nginx (NOT inside Docker). It terminates TLS and
# proxies to the app container published on 127.0.0.1:8011.
#
# Install:
#   sudo cp deploy/nginx/cityagent.conf /etc/nginx/conf.d/cityagent.conf
#   # edit server_name + cert paths below
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (Let's Encrypt, free, auto-renew):
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d agent.yourcompany.com
#   # certbot fills in the ssl_certificate lines + sets up renewal automatically.
#
# WHY THIS MATTERS FOR EMBEDDING (the 403 fix):
#   The widget runs on a customer's site and sends an `Origin:` header. The app
#   checks that Origin against the embed key's allowlist. If nginx drops or
#   rewrites Origin, the app sees the wrong value and returns
#   "Origin ... not in allowlist (403)" even when the allowlist is correct.
#   The `proxy_set_header Origin $http_origin;` line below preserves it.
# ---------------------------------------------------------------------------

# App container (compose publishes it on the loopback interface).
upstream cityagent_app {
    server 127.0.0.1:8011;
    keepalive 32;
}

# WebSocket / SSE upgrade handling. conf.d files load in the http{} context, so
# this map is valid here. If your nginx.conf already defines it, delete this.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP → HTTPS redirect (certbot also manages this once a cert exists) ──
server {
    listen 80;
    listen [::]:80;
    server_name agent.yourcompany.com;   # <-- CHANGE ME

    # Allow ACME http-01 challenge through before redirecting.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS site ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agent.yourcompany.com;   # <-- CHANGE ME

    # certbot --nginx fills these in; placeholders shown for manual setup.
    # ssl_certificate     /etc/letsencrypt/live/agent.yourcompany.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/agent.yourcompany.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Large uploads (document ingest + SFTP-staged files go through the app).
    client_max_body_size 250m;

    # Security headers (mirror the old Caddy config).
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── SSE streaming endpoints — must NOT be buffered ──
    # Embed chat stream + main chat stream. Buffering here makes the widget
    # look frozen until the whole answer is ready.
    location ~ ^/api/(embed/chat/stream|.*/stream) {
        proxy_pass         http://cityagent_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Origin            $http_origin;   # <-- preserve Origin (403 fix)
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;            # stream tokens straight through
        proxy_cache        off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ── Everything else (API + static SPA + widget.js) ──
    location / {
        proxy_pass         http://cityagent_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Origin            $http_origin;   # <-- preserve Origin (403 fix)
        proxy_set_header   Referer           $http_referer;  # fallback origin source
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket / upgrade support (future-proof).
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
